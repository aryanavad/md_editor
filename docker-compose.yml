services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: markdown
      POSTGRES_PASSWORD: markdown
      POSTGRES_DB: markdown
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markdown"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
